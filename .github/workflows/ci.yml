name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-tests:
    name: Swift package tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true
      - name: Toolchain
        run: swift --version
      - name: Build
        run: |
          set -o pipefail
          swift build --build-tests 2>&1 | tee build.log
      - name: Test
        run: |
          set -o pipefail
          swift test --skip-build 2>&1 | tee test.log
      - name: Failure summary
        if: failure()
        run: |
          echo "==== Compiler errors ===="
          grep -E "error:" build.log 2>/dev/null | sed -E 's#^/Users/runner/work/ferret/ferret/##' | sort -u | head -80 || true
          echo "==== Test failures ===="
          grep -E "✘|↳|Expectation failed|Issue recorded" test.log 2>/dev/null | grep -v "^.*✘ Suite" | cut -c1-600 | head -120 || true

  ios-app:
    name: iOS app build (simulator, unsigned)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: |
          xcodegen generate
          defaults write com.apple.dt.Xcode IDEBuildingContinueBuildingAfterErrors -bool YES
      - name: Build app, tunnel and widgets
        run: |
          set -o pipefail
          xcodebuild -project Ferret.xcodeproj -scheme Ferret \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee xcode.log | grep -E "error:|warning: .*(Ferret|App/)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" xcode.log
      - name: Failure summary
        if: failure()
        run: |
          grep -E "error:" xcode.log | sed -E 's#^/Users/runner/work/ferret/ferret/##' | sort -u | head -100 || true
